flex:1;border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:14px;background:rgba(255,255,255,.035);text-align:left;font-size:13px}.choice.active{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}.themes{display:flex;gap:15px;align-items:center}.theme-dot{height:37px;width:37px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.17)}.theme-dot.active{box-shadow:0 0 0 2px white}.range-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.range-row input{width:100%;accent-color:var(--gold)}.range-row span{min-width:43px;color:var(--gold);font-size:12px}.setting-switch{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0}.switch{position:relative;width:49px;height:29px;background:#444;border:0;border-radius:30px;transition:background .25s}.switch.active{background:var(--gold)}.switch:after{content:'';position:absolute;width:23px;height:23px;border-radius:50%;left:3px;top:3px;background:#e9e8e5;transition:transform .26s cubic-bezier(.22,1.5,.3,1)}.switch.active:after{transform:translateX(20px)}.slot-row{width:100%;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.025);display:flex;align-items:center;gap:13px;padding:12px 15px;text-align:left;margin-bottom:9px}.slot-icon{width:40px;height:40px;border-radius:14px;background:var(--gold-soft);display:grid;place-items:center;color:var(--gold);flex:none}.slot-icon svg{width:21px;height:21px}.slot-row .slot-meta{flex:1}.slot-row strong{display:block;font-size:13px;font-weight:500}.slot-row small{display:block;color:#777;font-size:10px;margin-top:4px}.slot-row>svg{width:16px;color:#777}.edit-desc{font-size:12px;color:#a9a19a;line-height:1.8;margin-top:-10px;margin-bottom:20px}.field-label{font-size:11px;color:#afaaa4;display:block;margin:18px 0 9px}.field{width:100%;background:#181b1e;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:13px;color:var(--ink);outl <body>
<main class="app" id="app"><div class="ambient"></div><div class="noise"></div>
 <section class="shell">
  <header class="top"><div class="brand"><div class="brand-mark"><i></i></div><h1>ArcDock<span style="color:var(--gold)">.</span></h1></div><button class="small-btn" id="settingsBtn" aria-label="打开设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="#242322"/><circle cx="16" cy="17" r="3" fill="#242322"/></svg></button></header>
  <div class="hero"><div class="index">01 / THE GESTURE</div><h2>一划<br/><em>即达。</em></h2><p>把常用操作，收进指尖的弧线。<br/>从屏幕边缘向内滑动，开始探索。</p></div>
  <div class="stage"><div class="orbit-visual"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="core"></div><div class="orbit-dot"></div><div class="orbit-dot secondary"></div></div><span class="stage-caption">GESTURE IS THE INTERFACE</span></div>
  <footer class="footer"><button type="button" id="globalButton" class="primary" style="width:100%;margin-bottom:7px;min-height:47px;background:linear-gradient(120deg,rgba(228,183,124,.21),rgba(228,183,124,.07));color:var(--gold);border:1px solid rgba(228,183,124,.31)">开启全局悬浮控制环</button><div style="text-align:center;font-size:10px;color:#aaa49c;margin:-9px 0 6px" id="globalStatus">可在任何 App 内从屏幕边缘呼出</div><div class="line-label"><span>QUICK ACTIONS <span id="slotCount">/ 05</span></span><button id="editBtn">编辑快捷项 ↗</button></div><div class="tiles" id="tiles"></div><div class="bottom-info"><span id="edgeHint">从右侧边缘向左滑动 ↙</span><span>ARC / 1.0</span></div></footer>
 </section>
 <div class="edge-zone" id="edgeZone"><span class="edge-marker"></span></div>
 <div class="dock-layer" id="dockLayer" aria-hidden="true"><div class="dock-dim" id="dockDim"></div><div class="dock-wash"></div><div class="dock-arc"></div><div class="dock-center"></div><div class="dock-indicator"></div><div class="floating-name" id="floatingName"></div><div id="dockItems"></div><div class="dock-hint" id="dockHint">沿弧线选择 · 松手执行</div></div>
 <div class="panel" id="panel" aria-hidden="true"><div class="panel-back" id="panelBack"></div><div class="sheet" id="sheet"><div class="handle"></div><div id="panelBody"></div></div></div>
 <div class="toast" id="toast" role="status"></div>
 <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display:none"/>
</main>
<script>
(()=>{'use strict';
 const SVG={camera:'<rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.4-2h5.2L16 6"/>',browser:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 6-5 12 0 18M12 3c5 6 5 12 0 18"/>',dial:'<path d="M5 3l4 1.5-1 4-2 1c1 4 4.5 7 8.5 8.5l1-2 4-1L21 19c-1 3-4 3-7 2C8 19 5 15 3 10 2 7 2 4 5 3Z"/>',share:'<circle cx="18" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="18" cy="19" r="2"/><path d="m8 11 8-5M8 13l8 5"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="16" cy="17" r="3"/>',url:'<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l2-2"/>',app:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',torch:'<path d="M8 3h8v4l-2 4v10h-4V11L8 7V3ZM8 7h8"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',chevron:'<path d="m9 5 7 7-7 7"/>'};
 const icon=(key)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(SVG[key]||SVG.app)+'</svg>';
 const BASE=[{type:'camera',label:'相机',value:''},{type:'browser',label:'浏览器',value:'https://www.google.com'},{type:'dial',label:'拨号',value:''},{type:'share',label:'分享',value:''},{type:'settings',label:'设置',value:''}];
 const DEFAULT={hand:'right',theme:'amber',glass:62,haptics:true,slots:BASE};let opts;try{opts={...DEFAULT,...JSON.parse((window.ArcNative&&ArcNative.getConfiguration()||localStorage.getItem('arcdock:v1')||'{}'))}}catch(e){opts={...DEFAULT}};
 if(!Array.isArray(opts.slots)||opts.slots.length!==5)opts.slots=structuredClone(BASE);opts.slots=opts.slots.map((s,i)=>({...BASE[i],...s}));
 const $=id=>document.getElementById(id);let dockOpen=false,dragging=false,active=-1,anchor=0,originX=0,originY=0,currentPointer=null,slotBeingEdited=0,lastHaptic=-1,toastTimer;
 const themes={amber:['#e4b77c','rgba(228,183,124,.13)'],ice:['#91d7d5','rgba(145,215,213,.13)'],orchid:['#c3a9ec','rgba(195,169,236,.13)']};
 const save=()=>{try{localStorage.setItem('arcdock:v1',JSON.stringify(opts))}catch(e){}try{if(window.ArcNative)ArcNative.saveConfiguration(JSON.stringify(opts))}catch(e){}};
 function apply(){let p=themes[opts.theme]||themes.amber;document.documentElement.style.setProperty('--gold',p[0]);document.documentElement.style.setProperty('--gold-soft',p[1]);document.documentElement.style.setProperty('--glass',opts.glass/100);document.documentElement.style.setProperty('--glass-top','rgba(255,255,255,'+(opts.glass/100*.31).toFixed(3)+')');document.documentElement.style.setProperty('--glass-bottom','rgba(255,255,255,'+(opts.glass/100*.085).toFixed(3)+')');$('edgeZone').classList.toggle('left',opts.hand==='left');$('edgeHint').textContent=opts.hand==='right'?'从右侧边缘向左滑动 ↙':'从左侧边缘向右滑动 ↘';renderTiles()}
 function renderTiles(){ $('tiles').innerHTML=opts.slots.map((s,i)=>'<button type="button" class="tile" data-slot="'+i+'" aria-label="执行'+esc(s.label)+'">'+icon(s.type)+'<span>'+esc(s.label)+'</span></button>').join('');$('tiles').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>execute(+b.dataset.slot)))}
 function esc(s){return String(s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
 function haptic(style='tick'){if(!opts.haptics)return;try{if(window.ArcNative){ArcNative.haptic(style)}else if(navigator.vibrate){navigator.vibrate(style==='commit'?24:10)}}catch(e){}}
 function toast(msg){let t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
 function viewport(){return {w:innerWidth,h:innerHeight}}
 function positions(){const {w}=viewport();const cx=opts.hand==='right'?w+21:-21;const angles=opts.hand==='right'?[135,157.5,180,202.5,225]:[-45,-22.5,0,22.5,45];return angles.map(a=>({x:cx+153*Math.cos(a*Math.PI/180),y:anchor+153*Math.sin(a*Math.PI/180)}))}
 function openDock(y,fromGesture=false){if(dockOpen)return;const {w,h}=viewport();anchor=Math.max(175,Math.min(h-175,y));dockOpen=true;active=-1;lastHaptic=-1;let cx=opts.hand==='right'?w+21:-21;$('dockLayer').style.setProperty('--cx',cx+'px');$('dockLayer').style.setProperty('--cy',anchor+'px');let p=positions();$('dockItems').innerHTML=opts.slots.map((s,i)=>'<button class="dock-item" data-id="'+i+'" style="--x:'+p[i].x+'px;--y:'+p[i].y+'px;--s:.35;--o:0" aria-label="'+esc(s.label)+'">'+icon(s.type)+'<small>'+esc(s.label)+'</small></button>').join('');$('dockLayer').classList.add('open');$('dockLayer').setAttribute('aria-hidden','false');let nodes=[...$('dockItems').children];nodes.forEach((n,i)=>{n.addEventListener('click',e=>{e.stopPropagation();if(!dragging){execute(i);closeDock()}});n.addEventListener('pointerdown',e=>e.stopPropagation());requestAnimationFrame(()=>setTimeout(()=>{n.style.setProperty('--s','1');n.style.setProperty('--o','1')},i*34))});$('dockHint').textContent=fromGesture?'沿弧线选择 · 松手执行':'点击目标 · 执行操作';haptic('open')}
 function selectAt(x,y){if(!dockOpen)return;const p=positions();let min=Infinity,best=-1;p.forEach((a,i)=>{let d=Math.hypot(x-a.x,y-a.y);if(d<min){min=d;best=i}});let next=min<84?best:-1;active=next;[...$('dockItems').children].forEach((n,i)=>{n.classList.toggle('selected',i===active);n.style.setProperty('--s',i===active?'1.18':'1')});$('floatingName').textContent=active<0?'':opts.slots[active].label;$('floatingName').classList.toggle('show',active>=0);if(active>=0&&active!==lastHaptic){haptic('tick');lastHaptic=active}}
 function closeDock(){dockOpen=false;dragging=false;currentPointer=null;active=-1;$('dockLayer').classList.remove('open');$('dockLayer').setAttribute('aria-hidden','true')}
 function execute(i){const s=opts.slots[i];haptic('commit');try{switch(s.type){case 'settings':openSettings();return;case 'share':if(window.ArcNative){ArcNative.execute('share',s.value||'ArcDock · 一划即达');return}if(navigator.share){navigator.share({title:'ArcDock',text:s.value||'来自 ArcDock 的分享'}).catch(()=>{});return}copyText(s.value||'ArcDock · 一划即达');return;case 'copy':if(window.ArcNative){ArcNative.execute('copy',s.value||'ArcDock');return}copyText(s.value||'ArcDock');return;case 'app':if(window.ArcNative){ArcNative.execute('app',s.value);return}toast('打开安装的应用需要 APK 版本');return;case 'torch':if(window.ArcNative){ArcNative.execute('torch','');return}toast('手电筒仅支持 APK 版本');return;case 'camera':if(window.ArcNative){ArcNative.execute('camera','');return}$('cameraInput').click();return;case 'dial':if(window.ArcNative){ArcNative.execute('dial',s.value||'');return}location.href='tel:'+encodeURIComponent(s.value||'');return;case 'browser':case 'url':let url=s.value||'https://www.google.com';if(!/^https?:\/\//i.test(url)){toast('仅支持 http / https 网页');return}if(window.ArcNative){ArcNative.execute('url',url);return}window.open(url,'_blank','noopener');return;default:toast('当前动作不可用')}}catch(e){toast('操作失败，请检查权限或设备支持')}}
 async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast('已复制到剪贴板')}catch(e){let el=document.createElement('textarea');el.value=txt;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();toast('已复制到剪贴板')}}
 const edge=$('edgeZone');edge.addEventListener('pointerdown',e=>{if(dockOpen||$('panel').classList.contains('open'))return;currentPointer=e.pointerId;originX=e.clientX;originY=e.clientY;dragging=true;edge.setPointerCapture(e.pointerId)});
 edge.addEventListener('pointermove',e=>{if(!dragging||currentPointer!==e.pointerId)return;const dx=e.clientX-originX;const inward=opts.hand==='right'?-dx:dx;if(!dockOpen&&inward>22)openDock(originY,true);if(dockOpen)selectAt(e.clientX,e.clientY)});
 edge.addEventListener('pointerup',e=>{if(!dragging||currentPointer!==e.pointerId)return;let selected=active;dragging=false;currentPointer=null;if(dockOpen&&selected>=0){closeDock();execute(selected)}else if(dockOpen){$('dockHint').textContent='点击目标 · 执行操作'}else{openDock(e.clientY,false)}});
 edge.addEventListener('pointercancel',()=>{dragging=false;currentPointer=null;if(dockOpen)closeDock()});
 $('dockDim').addEventListener('click',closeDock);$('dockLayer').addEventListener('pointermove',e=>{if(e.buttons&&dockOpen)selectAt(e.clientX,e.clientY)});window.arcBack=()=>{if(dockOpen){closeDock();return true}if($('panel').classList.contains('open')){closePanel();return true}return false};window.addEventListener('keydown',e=>{if(e.key==='Escape')window.arcBack()});
 window.addEventListener('resize',()=>{if(dockOpen)closeDock()});
 function sheet(title,inside){$('panelBody').innerHTML='<div class="sheet-head"><h3>'+title+'</h3><button id="closeSheet" aria-label="关闭">✕</button></div>'+inside;$('closeSheet').addEventListener('click',closePanel);$('sheet').scrollTop=0;$('panel').classList.add('open');$('panel').setAttribute('aria-hidden','false')}
 function closePanel(){$('panel').classList.remove('open');$('panel').setAttribute('aria-hidden','true')}
 $('panelBack').addEventListener('click',closePanel);$('settingsBtn').addEventListener('click',openSettings);$('editBtn').addEventListener('click',openSlots);
 function openSettings(){sheet('偏好设置','<div class="setting-title">惯用手 · DOMINANT HAND</div><div class="two-choice"><button class="choice '+(opts.hand==='left'?'active':'')+'" data-hand="left">◖ 左手模式</button><button class="choice '+(opts.hand==='right'?'active':'')+'" data-hand="right">右手模式 ◗</button></div><div class="setting-title">视觉风格 · ACCENT</div><div class="themes">'+[['amber','#e4b77c'],['ice','#91d7d5'],['orchid','#c3a9ec']].map(([k,c])=>'<button class="theme-dot '+(opts.theme===k?'active':'')+'" data-theme="'+k+'" style="background:'+c+'" aria-label="'+k+'主题"></button>').join('')+'</div><div class="setting-title">玻璃透亮度 · GLASS</div><div class="range-row"><input id="glassRange" type="range" min="20" max="95" value="'+opts.glass+'"/><span id="glassVal">'+opts.glass+'%</span></div><div class="setting-title">互动反馈 · FEEDBACK</div><div class="setting-switch"><div><div style="font-size:13px">触觉反馈</div><div style="font-size:10px;color:#78736d;margin-top:4px">滑动选择与操作确认时轻震</div></div><button class="switch '+(opts.haptics?'active':'')+'" id="hapticSwitch" aria-label="触觉反馈开关"></button></div><button class="primary" id="openSlotEdit">管理五个快捷项</button><div class="setting-title">全局控制环 · SYSTEM OVERLAY</div><button class="primary" id="overlayToggleSettings">启用全局悬浮</button><p class="inline-note" id="overlaySettingStatus">首次启用需要在系统设置中授予悬浮窗权限。关闭后立即撤掉边缘把手。</p>');document.querySelectorAll('[data-hand]').forEach(b=>b.addEventListener('click',()=>{opts.hand=b.dataset.hand;save();apply();openSettings();haptic('tick')}));document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{opts.theme=b.dataset.theme;save();apply();openSettings();haptic('tick')}));$('glassRange').addEventListener('input',e=>{opts.glass=+e.target.value;$('glassVal').textContent=opts.glass+'%';document.documentElement.style.setProperty('--glass',opts.glass/100);document.documentElement.style.setProperty('--glass-top','rgba(255,255,255,'+(opts.glass/100*.31).toFixed(3)+')');document.documentElement.style.setProperty('--glass-bottom','rgba(255,255,255,'+(opts.glass/100*.085).toFixed(3)+')');save()});$('hapticSwitch').addEventListener('click',()=>{opts.haptics=!opts.haptics;save();openSettings();haptic('tick')});$('openSlotEdit').addEventListener('click',openSlots);$('overlayToggleSettings').addEventListener('click',toggleOverlay);syncOverlayUI()}
 const kindNames={camera:'相机',browser:'浏览器',dial:'拨号',share:'分享',settings:'设置页面',url:'自定义网页',app:'已安装应用',torch:'手电筒',copy:'复制文本'};
 function openSlots(){sheet('快捷项','<div class="edit-desc">点击某个位置，修改它的功能与名字。操作环会立即同步。</div>'+opts.slots.map((s,i)=>'<button class="slot-row" data-edit="'+i+'"><span class="slot-icon">'+icon(s.type)+'</span><span class="slot-meta"><strong>'+esc(s.label)+'</strong><small>0'+(i+1)+' · '+(kindNames[s.type]||s.type)+'</small></span>'+icon('chevron')+'</button>').join('')+'<p class="inline-note">你也可以直接点击主屏幕快捷卡片执行。滑动选择后松手无需再次确认。</p>');document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEditor(+b.dataset.edit)))}
 function openEditor(i){slotBeingEdited=i;const s=opts.slots[i];sheet('编辑 · 0'+(i+1),'<div class="edit-desc">为控制环的位置 0'+(i+1)+' 自定义名称和操作。</div><label class="field-label" for="slotName">显示名称</label><input class="field" maxlength="10" id="slotName" value="'+esc(s.label)+'"/><label class="field-label" for="kindSelect">执行动作</label><select class="field" id="kindSelect">'+Object.entries(kindNames).map(([k,v])=>'<option value="'+k+'" '+(s.type===k?'selected':'')+'>'+v+'</option>').join('')+'</select><div id="valueBox"></div><button class="primary" id="saveSlot">保存快捷项</button><button id="backSlots" style="border:0;background:none;color:var(--gold);width:100%;padding:16px;margin-top:8px">返回快捷项列表</button>');$('kindSelect').addEventListener('change',renderValueInput);$('saveSlot').addEventListener('click',saveSlot);$('backSlots').addEventListener('click',openSlots);renderValueInput()}
 function renderValueInput(){const kind=$('kindSelect').value;const s=opts.slots[slotBeingEdited];let help='',placeholder='';if(kind==='url'||kind==='browser'){help='目标网址（必须是 https:// 或 http://）';placeholder='https://example.com'}else if(kind==='dial'){help='预设电话号码（留空则打开拨号盘）';placeholder='电话号码，可留空'}else if(kind==='copy'||kind==='share'){help=kind==='copy'?'复制到剪贴板的文字':'默认分享的文字';placeholder='填写要使用的文字'}else if(kind==='app'){help='选择安卓手机中已安装的应用';placeholder='应用包名'}else{$('valueBox').innerHTML='';return}let html='<label class="field-label" for="slotValue">'+help+'</label><input class="field" id="slotValue" value="'+esc(s.type===kind?s.value:'')+'" placeholder="'+placeholder+'"/>';if(kind==='app')html+='<button class="choice" id="pickApp" style="margin-top:10px;width:100%">选择已安装的应用</button><div id="appsList" style="max-height:160px;overflow:auto;margin-top:8px"></div>';$('valueBox').innerHTML=html;if(kind==='app')$('pickApp').addEventListener('click',showApps)}
 function showApps(){if(!window.ArcNative){toast('应用选择器仅在 Android APK 中可用');return}try{const apps=JSON.parse(ArcNative.getApps());$('appsList').innerHTML=apps.slice(0,120).map(a=>'<button class="slot-row" data-pkg="'+esc(a.packageName)+'" data-name="'+esc(a.label)+'" style="padding:10px 12px">'+esc(a.label)+'</button>').join('')||'<div class="inline-note">未读取到可启动的应用</div>';document.querySelectorAll('[data-pkg]').forEach(b=>b.addEventListener('click',()=>{$('slotValue').value=b.dataset.pkg;if(!$('slotName').value||$('slotName').value==='应用')$('slotName').value=b.dataset.name.slice(0,10);$('appsList').innerHTML='';toast('已选择 '+b.dataset.name)}))}catch(e){toast('读取应用列表失败')}}
 function saveSlot(){const type=$('kindSelect').value;const label=$('slotName').value.trim()||kindNames[type];const value=$('slotValue')?.value.trim()||'';if((type==='url'||type==='browser')&&value&&!/^https?:\/\//i.test(value)){toast('网址需以 https:// 或 http:// 开头');return}if(type==='app'&&!value){toast('请先选择应用');return}opts.slots[slotBeingEdited]={type,label:label.slice(0,10),value};save();renderTiles();haptic('commit');openSlots();toast('快捷项已保存')}
 function readOverlay(){try{return window.ArcNative?JSON.parse(ArcNative.overlayStatus()):null}catch(e){return null}}
 function syncOverlayUI(){const o=readOverlay();const on=!!(o&&o.enabled&&o.permission);const line=o?(on?(o.running?'全局控制环正在运行 · 屏幕边缘滑入':'已授权 · 正在启动悬浮服务'):(o.permission?'全局控制环已关闭':'需要开启「显示在其他应用上层」权限')):'浏览器预览模式，安装 APK 后可使用全局控制环';const b=$('globalButton');if(b){b.textContent=on?'关闭全局控制环':'开启全局悬浮控制环';}const label=$('globalStatus');if(label)label.textContent=line;const setting=$('overlayToggleSettings');if(setting)setting.textContent=on?'关闭全局悬浮':'启用全局悬浮';const txt=$('overlaySettingStatus');if(txt)txt.textContent=line+'。可在悬浮控制环上上下拖动，调整把手高度。';}
 function toggleOverlay(){if(!window.ArcNative){toast('请在安卓 APK 内启用全局悬浮');return}const o=readOverlay();if(o&&o.enabled&&o.permission)ArcNative.disableOverlay();else ArcNative.enableOverlay();setTimeout(syncOverlayUI,700)}
 window.syncOverlayUI=syncOverlayUI;
 $('globalButton').addEventListener('click',toggleOverlay);
 apply();save();syncOverlayUI();
 if(window.ArcNative){document.body.classList.add('native');}
