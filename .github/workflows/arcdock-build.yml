name: ArcDock v1.0.0 - Build and Publish APK
on:
  push:
    branches: [arcdock-cloud-v010]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 35 with maintained setup-android v4
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ArcDock-v1.0.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct-download APK to public GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="arcdock-v1.0.0"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" ArcDock-v1.0.0-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ArcDock-v1.0.0-debug.apk --clobber
          else
            gh release create "$TAG" ArcDock-v1.0.0-debug.apk --target "$GITHUB_SHA" --title "ArcDock v1.0.0 · Global Edge Launcher" --notes "ArcDock v1.0.0 Android global floating radial shortcut launcher. Debug-signed, offline APK; fully separate from Mineradio. Grant overlay permission to enable."
          fi
