name: ArcDock v0.1.0 - Build and Publish APK
on:
  push:
    branches: [arcdock-cloud-v010]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 35 using runner's existing command-line tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ArcDock-v0.1.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct-download APK to public GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="arcdock-v0.1.0"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" ArcDock-v0.1.0-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ArcDock-v0.1.0-debug.apk --clobber
          else
            gh release create "$TAG" ArcDock-v0.1.0-debug.apk --target "$GITHUB_SHA" --title "ArcDock v0.1.0 (Android APK)" --notes "ArcDock Android preview. Debug-signed APK. Built by GitHub Actions from a temporary isolated branch. Not a Mineradio app update."
          fi
